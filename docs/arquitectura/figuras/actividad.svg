egación, borrado y audio solicitado.</tspan><tspan x="560" dy="27">El envío de sus eventos ocurre en la tarea de red independiente.</tspan></text><path d="M80,1190H1040" stroke="#bdc9cd" stroke-width="1"/><text x="560" y="1235" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" fill="#142d38"><tspan x="560" dy="0">ACT1 Registro asíncrono de cada evento</tspan></text><circle cx="560" cy="1280" r="12" fill="#142d38"/><path d="M560,1293L560,1325" fill="none" stroke="#425e68" stroke-width="2" marker-end="url(#arrow)"/><path d="M560,1325L655,1370L560,1415L465,1370Z" fill="white" stroke="#142d38" stroke-width="2"/><text x="560" y="1377" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#142d38"><tspan x="560" dy="0">¿Hay espacio?</tspan></text><path d="M655,1370L895,1370L895,1414" fill="none" stroke="#425e68" stroke-width="2" marker-end="url(#arrow)"/><text x="770" y="1352" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#142d38"><tspan x="770" dy="0">[no]</tspan></text><rect x="745.0" y="1414.0" width="300" height="72" rx="16" fill="white" stroke="#142d38" stroke-width="2"/><text x="895" y="1458" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#142d38"><tspan x="895" dy="0">Rechazar nuevo encolado</tspan></text><path d="M895,1486L895,1520" fill="none" stroke="#425e68" stroke-width="2" marker-end="url(#arrow)"/><circle cx="895" cy="1538" r="16" fill="white" stroke="#142d38" stroke-width="2"/><circle cx="895" cy="1538" r="10" fill="#142d38"/><path d="M560,1415L560,1484" fill="none" stroke="#425e68" stroke-width="2" marker-end="url(#arrow)"/><text x="605" y="1450" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#142d38"><tspan x="605" dy="0">[sí]</tspan></text><rect x="385.0" y="1484.0" width="350" height="72" rx="16" fill="white" stroke="#142d38" stroke-width="2"/><text x="560" y="1528" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#1